
version: '3.8'

services:
  # 1. Database Container
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db 

  # 2. Backend Container
  backend:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
    - .env
    depends_on:
      - mongodb

  # 3. Frontend Container
  frontend:
    build: ./client 
    ports:
      - "5173:5173" 
    env_file:
    - .env
    depends_on:
      - backend

# Declare the volume we named above
volumes:
  mongo-data: