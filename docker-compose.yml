
version: '3.8'

services:
  # 1. Database Container
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db 

  # 2. Backend Container
  backend:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb+srv://akashyadavakash03_db_user:60k7w9FErCxNVgSF@cluster0.nbh8ukb.mongodb.net/?appName=Cluster0
    depends_on:
      - mongodb

  # 3. Frontend Container
  frontend:
    build: ./client 
    ports:
      - "5173:5173" 
    environment:
      # Tells React where to send API requests
      - VITE_API_URL=http://localhost:5000 
      # (If using Vite, use VITE_API_URL=http://localhost:5000)
    depends_on:
      - backend

# Declare the volume we named above
volumes:
  mongo-data: