
services:
  # Database Container
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db 

  # Backend Container
  backend:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
    - ./server/.env
    depends_on:
      - mongodb

  # Frontend Container
  frontend:
    build: ./client 
    ports:
      - "5173:5173" 
    env_file:
    - ./client/.env
    depends_on:
      - backend

volumes:
  mongo-data: